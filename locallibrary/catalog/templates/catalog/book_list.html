{%extends "base_index.html"%}
{% block title %}
  <title>Books</title>
{%endblock%}
{%block content %}
<h1>Book List </h1>
{%if book_list %}
<ul>
    {% for books in book_list %}
    <li>
        <a href="{{books.get_absolute_url}}">{{books.title}}</a> 
        ({{books.author}})
    </li>
    {%endfor%}
</ul>
{%else%}
    <p>There are no books available at the moment</p>
{%endif%}
{%endblock%}
